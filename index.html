<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Terraform AI Generator</title>


<!-- JSZip -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
</script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #0f172a;

    color: white;
}


.container {

    width: 92%;

    max-width: 1400px;

    margin: auto;

    padding: 40px 0;
}


h1 {

    font-size: 38px;

    margin-bottom: 8px;
}


.subtitle {

    color: #94a3b8;

    margin-bottom: 30px;
}


textarea {

    width: 100%;

    min-height: 220px;

    padding: 20px;

    border-radius: 10px;

    border: 1px solid #334155;

    background: #020617;

    color: white;

    font-size: 16px;

    resize: vertical;

    outline: none;
}


textarea:focus {

    border-color: #06b6d4;
}


button {

    margin-top: 15px;

    padding: 13px 24px;

    border: none;

    border-radius: 8px;

    background: #06b6d4;

    color: white;

    font-size: 15px;

    cursor: pointer;
}


button:hover {

    background: #0891b2;
}


#download-btn {

    display: none;

    background: #16a34a;

    margin-left: 10px;
}


#download-btn:hover {

    background: #15803d;
}


.loading {

    margin-top: 25px;

    color: #22d3ee;

    font-size: 16px;
}


.success {

    margin-top: 25px;

    color: #4ade80;

    font-size: 16px;
}


.error {

    margin-top: 25px;

    color: #f87171;

    background: #450a0a;

    padding: 15px;

    border-radius: 8px;
}


.files-section {

    margin-top: 40px;
}


.file-card {

    margin-bottom: 25px;

    border: 1px solid #334155;

    border-radius: 10px;

    overflow: hidden;

    background: #020617;
}


.file-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px 20px;

    background: #1e293b;

    font-weight: bold;
}


.file-header button {

    margin: 0;

    padding: 7px 14px;

    font-size: 13px;
}


pre {

    margin: 0;

    padding: 20px;

    overflow-x: auto;

    white-space: pre-wrap;

    color: #e2e8f0;

    line-height: 1.5;

    font-size: 14px;
}


code {

    font-family:
        "Courier New",
        monospace;
}


.actions {

    margin-top: 15px;
}


</style>

</head>


<body>


<div class="container">


<h1>
Terraform AI Generator
</h1>


<div class="subtitle">

Describe your AWS infrastructure.
AI will generate a complete Terraform project.

</div>


<textarea
    id="prompt"
    placeholder="Example:

Create a production AWS 3-tier architecture.

VPC: 10.0.0.0/16

Create:
- 2 public subnets
- 2 private application subnets
- 2 private database subnets
- Internet Gateway
- NAT Gateway
- Application Load Balancer
- Auto Scaling Group
- RDS MySQL

Use variables and outputs.

Generate a complete Terraform project."
></textarea>


<div class="actions">


<button onclick="generateTerraform()">

🤖 Generate Terraform

</button>


<button
    id="download-btn"
    onclick="downloadZip()">

⬇ Download Complete ZIP

</button>


</div>


<div id="status"></div>


<div class="files-section">

<h2>
Generated Terraform Files
</h2>


<div id="files-container">

</div>


</div>


</div>


<script src="app.js"></script>


</body>

</html>
