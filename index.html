
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Terraform AI Generator</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #0f172a;

    color: white;

}


.container {

    width: 90%;

    max-width: 1200px;

    margin: auto;

    padding: 40px 0;

}


h1 {

    font-size: 38px;

    margin-bottom: 10px;

}


.subtitle {

    color: #94a3b8;

    margin-bottom: 30px;

}


textarea {

    width: 100%;

    height: 220px;

    padding: 20px;

    border-radius: 10px;

    border: 1px solid #334155;

    background: #020617;

    color: white;

    font-size: 16px;

    resize: vertical;

}


button {

    margin-top: 15px;

    padding: 14px 28px;

    border: none;

    border-radius: 8px;

    background: #06b6d4;

    color: white;

    font-size: 16px;

    cursor: pointer;

}


button:hover {

    background: #0891b2;

}


.output {

    margin-top: 35px;

}


pre {

    background: #020617;

    border: 1px solid #334155;

    padding: 20px;

    border-radius: 10px;

    overflow-x: auto;

    white-space: pre-wrap;

    line-height: 1.5;

}


.loading {

    color: #22d3ee;

    margin-bottom: 10px;

}

</style>

</head>


<body>


<div class="container">


<h1>

Terraform AI Generator

</h1>


<div class="subtitle">

Describe your AWS infrastructure and generate Terraform configuration.

</div>


<textarea
id="prompt"
placeholder="Example:

Create an AWS VPC with CIDR 10.0.0.0/16.

Create two public subnets.

Create two private subnets.

Create an Internet Gateway.

Create NAT Gateway.

Create route tables.

Create an Application Load Balancer.

Use variables and outputs.

Generate provider.tf, variables.tf, main.tf and outputs.tf.">
</textarea>


<br>


<button onclick="generateTerraform()">

Generate Terraform

</button>


<div class="output">

<h2>Generated Terraform</h2>

<div id="status"></div>

<pre id="result"></pre>

</div>


</div>


<script src="app.js"></script>

</body>

</html>
